    - generic [ref=e122]:
      - paragraph [ref=e123]:
        - strong [ref=e124]: "核心理由:"
      - list [ref=e125]:
        - listitem [ref=e126]:
          - strong [ref=e127]: "设定契合:"
          - text: MOSS是AI系统，玩家扮演的是MOSS。终端风格的">"提示符和等宽字体强化了"你是AI"的身份认知。
        - listitem [ref=e128]:
          - strong [ref=e129]: "沉浸感强:"
          - text: 流浪地球系列中的MOSS界面就是这种简洁、克制、高效的控制台风格，玩家能立刻产生代入感。
        - listitem [ref=e130]:
          - strong [ref=e131]: "信息优先:"
          - text: 事件选项的关键是让玩家快速理解后果（秩序-20/希望+20），简洁的按钮样式让信息成为焦点，而非按钮本身。
        - listitem [ref=e132]:
          - strong [ref=e133]: "一致性:"
          - text: 与项目现有UI风格（深青色背景、浅青色边框）高度统一，不会显得突兀。
      - paragraph [ref=e134]:
        - strong [ref=e135]: "实施建议:"
      - list [ref=e136]:
        - listitem [ref=e137]: 使用等宽字体 (如Consolas, 或Godot的monospace字体)
        - listitem [ref=e138]: 左侧4px边框作为视觉锚点，hover时变为青绿色发光
        - listitem [ref=e139]: 禁用状态使用深灰色，保持界面整洁
        - listitem [ref=e140]: 效果数值用红色/绿色区分负面/正面影响